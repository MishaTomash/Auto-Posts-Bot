name: Deploy Auto-Posts-Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            if [ ! -d "$HOME/auto-posts-bot" ]; then
              git clone https://github.com/${{ github.repository }}.git ~/auto-posts-bot
              cd ~/auto-posts-bot
            else
              cd ~/auto-posts-bot
              git pull origin main
            fi

            npm ci --omit=dev

            pm2 restart "auto-posts-bot" --update-env || pm2 start index.js --name "auto-posts-bot"
